<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: Premium Flat Dark Slate Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="#0f172a" />
  
  <!-- Outer Circuit / Architecture Ring in Flat Cyan -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#1e293b" stroke-width="16" />

  <!-- Flat Brain & Gateway Dual Hemispheres -->
  <!-- Left Side: AI Gateway / Neural Architecture (Flat Vibrant Cyan #06b6d4 & #0284c7) -->
  <path d="M 236 128 C 172 128 132 176 132 236 C 132 264 144 288 162 306 C 150 328 154 356 172 372 C 190 388 216 388 236 384" 
        fill="none" stroke="#06b6d4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Left Neural Network Nodes & Connector -->
  <line x1="172" y1="204" x2="216" y2="236" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
  <line x1="160" y1="284" x2="216" y2="236" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
  <line x1="160" y1="284" x2="196" y2="340" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
  <circle cx="172" cy="204" r="14" fill="#38bdf8" />
  <circle cx="216" cy="236" r="12" fill="#38bdf8" />
  <circle cx="160" cy="284" r="12" fill="#38bdf8" />
  <circle cx="196" cy="340" r="14" fill="#38bdf8" />

  <!-- Right Side: Analytics & Cost Monitoring (Flat Emerald #10b981 & #059669) -->
  <path d="M 276 128 C 340 128 380 176 380 236 C 380 264 368 288 350 306 C 362 328 358 356 340 372 C 322 388 296 388 276 384" 
        fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Flat Analytics Bars inside Right Lobe -->
  <rect x="282" y="276" width="18" height="68" rx="6" fill="#059669" />
  <rect x="310" y="236" width="18" height="108" rx="6" fill="#10b981" />
  <rect x="338" y="196" width="18" height="148" rx="6" fill="#34d399" />

  <!-- Center Diagonal Trend / Connector (Solid Flat Indigo/White) -->
  <polyline points="148,348 216,276 276,306 364,176" 
            fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Trend Vertex Points -->
  <circle cx="148" cy="348" r="9" fill="#ffffff" />
  <circle cx="216" cy="276" r="9" fill="#ffffff" />
  <circle cx="276" cy="306" r="9" fill="#ffffff" />
  
  <!-- Crisp Arrowhead -->
  <polygon points="364,152 376,188 344,180" fill="#ffffff" />

  <!-- Flat Currency Glyph Top Right -->
  <circle cx="316" cy="162" r="18" fill="#10b981" />
  <text x="316" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">$</text>
</svg>
